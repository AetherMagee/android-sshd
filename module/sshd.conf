# android-sshd settings. Survives module updates.
# Edit here, then run: sshd.service restart
# Keys and their privileges: /data/adb/sshd/authorized_keys (applies on the next login).

# TCP port. Tailscale SSH (`tailscale set --ssh`) answers port 22 on the tailnet
# IPs before this server sees it: turn it off (`tailscale set --ssh=false`) or
# pick another port.
PORT=22

# 1: only tailnet peers can connect (needs the Tailscale module; peers are
#    identified with `tailscale whois`, and from-node= matches their names).
# 0: any network, including Wi-Fi and mobile data.
TAILNET_ONLY=1

# Seconds to wait for an answer on the phone before denying a login.
PROMPT_TIMEOUT=60

# Extra android-sshd flags.
EXTRA_ARGS=""
