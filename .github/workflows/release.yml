name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION] # bump VERSION to release

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog: commits since the previous release tag

      - name: Check version
        id: v
        run: |
          version="v$(cat VERSION)"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version already released"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip != 'true'
        with:
          go-version-file: sshd/go.mod
          cache-dependency-path: sshd/go.sum

      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        if: steps.v.outputs.skip != 'true'
        run: ./build.sh # ubuntu-latest ships the Android SDK in $ANDROID_HOME

      - name: Publish
        if: steps.v.outputs.skip != 'true'
        run: |
          . dist/build.env
          # Notes: feat/fix commit subjects since the previous release.
          prev=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [ -n "$prev" ]; then
            git log --reverse --format=%s "$prev..HEAD" | sed -nE 's/^(feat|fix)(\([^)]*\))?!?: (.)/- \u\3/p' >notes.md
          else
            echo "- First release" >notes.md
          fi
          [ -s notes.md ] || echo "- Rebuild, no user-facing changes" >notes.md
          { printf '# Changelog\n\n## %s\n\n' "$VERSION"; cat notes.md; echo; tail -n +3 CHANGELOG.md; } >CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          gh release create "$VERSION" "$ZIP" --title "$VERSION" --notes-file notes.md
          cat >update.json <<EOT
          {
            "version": "$VERSION",
            "versionCode": $VERSION_CODE,
            "zipUrl": "${{ github.server_url }}/${{ github.repository }}/releases/download/$VERSION/$(basename "$ZIP")",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          EOT
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add update.json CHANGELOG.md
          git commit -m "chore: release $VERSION"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
